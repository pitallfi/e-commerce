<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns pela Compra! - Beco Diagonal</title>
    <!-- Vincula o CSS exclusivo para os cards de tela cheia -->
    <link rel="stylesheet" href="./css/style-parabens.css">
</head>
<body class="light-theme">

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">
                    <img src="./img/logo-menusuperior.jpg" alt="Logo Beco Diagonal Coffee Shop">
                </a>
            </div>
            <div class="nav-right">
                <div class="cart">
                    <a href="index.html" aria-label="Voltar para a loja">
                        <img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png" alt="Ícone do Carrinho">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Container Central Flexbox -->
    <main class="center-container">
        <div class="single-card">
            <div class="card-icon">🎉✨</div>
            <h1 class="card-title">Parabéns! Compra Realizada</h1>
            
            <p class="card-description">
                Sua encomenda mágica já está sendo preparada pelos nossos artesãos do <strong>Beco Diagonal Coffee Shop</strong>! Em breve, suas poções e itens especiais estarão a caminho.
            </p>

            <div class="order-info-box">
                <p class="order-code">Código do Pedido: #BD-98421</p>
                <p class="order-detail">Enviamos os detalhes do rastreio para o seu e-mail.</p>
            </div>

            <a href="index.html" class="btn-action">Voltar para a Loja</a>
        </div>
    </main>

</body>
</html>
