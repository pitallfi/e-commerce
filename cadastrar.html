    <!-- Área de Cadastro Centralizada -->
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card auth-card p-4 col-12 col-md-6 col-lg-5 mt-4 mb-4">
            <h2 class="text-center mb-4 font-antiga" style="color: #352315;">Registro de Bruxo</h2>
            
            <div id="cad-alert" class="alert d-none" role="alert"></div>
            
            <form id="form-cadastro">
                <div class="mb-3">
                    <label for="novoUsuario" class="form-label" style="color: #6b4226; font-weight: bold;">Escolha um Nome de Usuário</label>
                    <input type="text" class="form-control form-auth" id="novoUsuario" required>
                </div>
                <div class="mb-3">
                    <label for="novaSenha" class="form-label" style="color: #6b4226; font-weight: bold;">Crie uma Palavra-Passe</label>
                    <input type="password" class="form-control form-auth" id="novaSenha" required>
                </div>
                <div class="mb-4">
                    <label for="confirmaSenha" class="form-label" style="color: #6b4226; font-weight: bold;">Confirme a Palavra-Passe</label>
                    <input type="password" class="form-control form-auth" id="confirmaSenha" required>
                </div>
                <button type="submit" class="btn btn-auth w-100 py-2 mb-3">Realizar Matrícula</button>
                
                <div class="text-center">
                    <a href="login.html" style="color: #6b4226; text-decoration: none; font-weight: bold;">Já possui registro? Entre aqui</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Lógica de Sair (Navbar) -->
    <script>
      const btnSair = document.getElementById('btn-sair');
      if (btnSair) {
          btnSair.addEventListener('click', function(e) {
              e.preventDefault();
              localStorage.removeItem('usuarioLogado');
              alert('Feito o feitiço! Você saiu do Beco Diagonal.');
              window.location.href = 'login.html';
          });
      }
    </script>

    <!-- Script Mágico do Carrinho para a Navbar -->
    <script src="./js/script.js"></script>

    <!-- Script de Cadastro -->
    <script>
        document.getElementById('form-cadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('novoUsuario').value;
            const senha = document.getElementById('novaSenha').value;
            const confirma = document.getElementById('confirmaSenha').value;
            const alerta = document.getElementById('cad-alert');
            
            // Verifica se as senhas são iguais
            if (senha !== confirma) {
                alerta.className = 'alert alert-danger';
                alerta.textContent = 'Feitiço falhou: As senhas não coincidem!';
                alerta.classList.remove('d-none');
                return;
            }
            
            // Puxa a lista de usuários salvos (se não existir cria array vazio)
            let usuarios = JSON.parse(localStorage.getItem('usuariosBeco')) || [];
            
            // Procura se o nome já está em uso
            const usuarioExiste = usuarios.find(u => u.usuario === usuario);
            
            if (usuarioExiste) {
                alerta.className = 'alert alert-warning';
                alerta.textContent = 'Este nome de bruxo já está em uso. Escolha outro.';
                alerta.classList.remove('d-none');
            } else {
                // Salva novo usuário
                usuarios.push({ usuario: usuario, senha: senha });
                localStorage.setItem('usuariosBeco', JSON.stringify(usuarios));
                
                alerta.className = 'alert alert-success';
                alerta.textContent = 'Matrícula realizada com sucesso! Preparando pó de flu...';
                alerta.classList.remove('d-none');
                
                // Aguarda 2 segundos e joga pra tela de login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });
    </script>
